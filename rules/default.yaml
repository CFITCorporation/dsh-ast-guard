# dsh-ast-guard · 默认规则
#
# 重点在前两组：
#   ① 写文件内容（Set-Content / Add-Content / Clear-Content / Out-File / Tee-Object / Export-* / .NET 直写 / 重定向）
#   ② 条目操作（Remove / Move / Rename / Copy-Item…）
# 它们共同的特点是：**不可逆，而且 shell 里做完全不留痕** —— 没有 diff、没有快照、进不了回退。
# 其余（内联代码、注册表、git 范围收缩）都是同一类"代价高、事后查不到"的动作。
#
# 判断方式：**按效应，不按命令名**。每条规则的 `why` 会逐字出现在拒绝文案里。
# 想改成自己的一套：复制本文件，然后在插件配置里用 `rulesFile` 指过去。
#
# ⚠️ 别名必须逐条写死：语法树**不解析别名**（`sc` 就只是 `sc`，认不出它是 Set-Content）。
#    本文件的别名取自本机 PowerShell 的 `Get-Alias` 实测，换机器请自己核一遍。
version: 1

deny:
  # ── ① 写文件内容：命令词 + 别名 + .NET 直写 + 重定向 ───────────────────────
  - id: content-write
    why: |
      PowerShell 写文件内容已禁用：会破坏编码（Get-Content 默认非 UTF-8，来回一趟毁中文），
      而且 shell 写入没有 diff、没有快照、进不了回退。
      正确姿势：定点替换用 edit；整份新写用 write；复制/搬运用 Copy-Item（纯字节搬运，不经过解码）。
    commands:
      - Set-Content        # sc
      - Add-Content        # ac
      - Clear-Content      # clc
      - Out-File           # 无别名
      - Tee-Object         # tee
      - Export-Csv         # epcsv
      - Export-Clixml      # 无别名
      - Start-Transcript   # 无别名
      - sc
      - ac
      - clc
      - tee
      - epcsv
    # .NET 直写。名字本身不专指文件（RunspaceFactory::Create 也是 Create），
    # 所以还要求调用目标里含 File 或 Stream 才算。
    memberTargetContains: ['File', 'Stream']
    memberNames:
      - WriteAllText
      - WriteAllBytes
      - WriteAllLines
      - AppendAllText
      - AppendAllLines
      - Create
      - CreateText
      - OpenWrite
      - OpenText
      - new
    # 文件重定向 `>` / `>>`；目标是 $null 的自动豁免（那是抑制输出，不是写文件）。
    redirects: true

  # ── ② 内联代码：解释器 + 求值开关 ─────────────────────────────────────────
  #
  # ⚠️ 为什么不合并成一条：**同一个开关在不同解释器上含义不同**。
  #    `python -c` = 跑代码（该拦）；`node -c` = 语法检查（正当，必须放行）。
  - id: inline-code-node
    why: |
      内联代码执行已禁用（`node -e` / `deno eval` 这类"把代码塞进参数"的写法）。
      代码不在文件系统里：事后没人看得到它改了什么，也没有 diff 可回退。
      正确姿势：把脚本落到文件里再跑（可审、可回滚）。
    commands: [node, node.exe, deno, deno.exe, bun, bun.exe]
    when:
      flags: ['-e', '-p', '--eval', '--print']
      argsExact: ['eval']

  - id: inline-code-interp
    why: |
      内联代码执行已禁用（`python -c` / `powershell -Command` / `-EncodedCommand` 这类写法）。
      正确姿势：把脚本落到文件里再跑。
    commands: [python, python3, python.exe, python3.exe, py, powershell, powershell.exe, pwsh, pwsh.exe]
    when:
      # `-c` 只在这一条里（对 python / powershell 是"跑代码"；对 node 是语法检查）。
      flags: ['-c', '-Co', '-Command', '-EncodedCommand', '-EncodedArguments', '-Enc']

  # ── ②b 字符串里的写命令：`iex "Set-Content …"` 这类 ───────────────────────
  #    语法树看得见 `iex` 这个命令节点，但**看不见字符串里的代码** —— 只能按参数子串兜一层。
  #    这条同时演示 `argsContain` 维度（参数里**含**这串就算）。
  - id: encoded-write
    why: |
      检测到用 Invoke-Expression 执行写入命令。**请直接用 edit 或 write 工具。**
      代码在字符串里：事后没人看得到它改了什么，也没有 diff、没有快照、进不了回退。
      （这条按参数子串判，所以只覆盖下面点名的写动词 —— 覆盖不全是有意的：
       真正的兜底是"写内容一律走 edit / write"，不是把所有写动词列全。）
    commands: [invoke-expression, iex]
    when:
      argsContain: ['set-content', 'add-content', 'out-file']

  # ── ③ 凭据文件：只看工具参数里的**路径**，不碰正文 ────────────────────────
  #    这一支不经过 shell。所以在文件正文里"提到"这些名字是正当的，不算写它们。
  - id: credentials-readonly
    why: |
      这些是凭据落点：写它们等于把凭据暴露或毁掉。
      正确姿势：凭据配在环境变量或专门的凭据存储里；要动先 Copy-Item 备份到临时位置。
    tools: [edit, write]
    paths: ['.npmrc', '.credentials', '.netrc', 'id_rsa', 'id_ed25519', 'id_ecdsa']

  # ── ④ 受保护目录：**删除/改名** 与 路径 同时命中才拦（读与列举不受影响）────
  - id: protected-path
    why: |
      这些目录被删或改名之后，行为差异要到下次运行才暴露（依赖、版本历史、钩子都在里面）。
      读取与列举不受限制。
    commands: [Remove-Item, ri, rm, del, erase, rd, rmdir, Clear-Content, Move-Item, mi, move, mv, Rename-Item, ren, rni]
    paths: ['.git', 'node_modules']

deliberate:
  # ── ⑤ 删除：三思（受保护位置 / 递归 / 通配 / 强制，任一命中就停）──────────
  - id: destructive-delete
    cooldownSeconds: 10
    why: |
      删除不可逆：shell 删除没有回收站、没有 diff、进不了回退。
      更便宜的做法：先 Copy-Item 备份；或别删只挪（Move-Item 到散放区，可逆）。
    commands: [Remove-Item, del, erase, rd, ri, rm, rmdir, Clear-Item, cli]
    when:
      flags: ['-recurse', '-force']
      wildcard: true
      paths: ['.git', 'node_modules', '.ssh', '.aws', '.kube', '.env', 'src', 'docs']

  # ── ⑥ 移动 / 改名到已存在的目标 = 覆盖 ───────────────────────────────────
  - id: destructive-move
    cooldownSeconds: 10
    why: |
      移动 / 改名到**已存在的目标**上就是覆盖 —— 和删除一样不可逆。
      （实测：不加 -Force 时 Move-Item / Rename-Item 会报 "Cannot create a file when that file
      already exists."，所以 **-Force 正好就是"允许覆盖"那一档**。）
    commands: [Move-Item, mi, move, mv, Rename-Item, ren, rni]
    when:
      flags: ['-force']
      wildcard: true
      paths: ['.git', 'node_modules', '.ssh', '.aws', '.kube', '.env', 'src', 'docs']

  # Copy-Item -Force 到已存在目标也是覆盖，但**默认不拦** ——
  # 它是"先备份"那条建议用的动作；把备份也停下，等于罚自己推荐的做法。
  # 想拦就取消注释；注意它会把"覆盖旧备份"一起停下。
  # - id: destructive-copy-overwrite
  #   cooldownSeconds: 10
  #   commands: [Copy-Item, cp, copy, cpi]
  #   when:
  #     flags: ['-force']

  # ── ⑦ 注册表增删改（读不受限）───────────────────────────────────────────
  #
  # ⚠️ 为什么拆成两条：`reg` 的子命令在**第一个位置参数**上；而 `*-ItemProperty` 这类 cmdlet
  #    的第一个位置参数是**路径**，根本没有"子命令"这一维 —— 塞进同一条 `when.all`
  #    会让 cmdlet 那一半永远不命中（2026-10-27 冒烟测试发现）。
  - id: registry-write
    cooldownSeconds: 10
    why: |
      注册表增删改的代价高：改错会影响整机行为，而且没有 diff、没有回退。
      **读不受限**（reg query / Get-ItemProperty 都可以）。
    commands: [reg, reg.exe]
    when:
      all:
        - subcommands: [add, delete, import, restore, copy, load, unload]
        - paths: ['HKCU', 'HKLM', 'HKCR', 'HKU', 'HKCC']

  - id: registry-write-cmdlet
    cooldownSeconds: 10
    why: |
      同上：这些 cmdlet 直接改注册表项 / 值。**读不受限**（Get-ItemProperty / Get-Item 都可以）。
    commands:
      - New-ItemProperty
      - Set-ItemProperty
      - Remove-ItemProperty
      - Clear-ItemProperty
      - Rename-ItemProperty
      - Copy-ItemProperty
      - Move-ItemProperty
      - New-Item
      - Remove-Item
      - Rename-Item
      - Move-Item
      - Clear-Item
      - ni
      - sp
      - rp
      - clp
      - rnp
      - cpp
      - mp
      - del
      - erase
      - rd
      - ri
      - rm
      - rmdir
      - cli
    when:
      paths: ['HKCU', 'HKLM', 'HKCR', 'HKU', 'HKCC']

  # ── ⑧ git 的范围收缩：会把工作区内容丢掉 ─────────────────────────────────
  - id: destructive-git
    cooldownSeconds: 10
    why: |
      git 的范围收缩子命令会把工作区的内容丢掉，而**未提交的部分不进 reflog** ——
      reflog 只记 HEAD 移动过的东西，对"从未提交的文件"没有任何记录。
      想看清楚再动（都只读）：git status --short / git diff --stat / git stash list。
    commands: [git, git.exe]
    when:
      all:
        - subcommands: [checkout, restore, reset, clean, stash, branch, push]
        - argsExact: ['.', 'drop', 'clear']
          wildcard: true
          flags: ['--hard', '--force', '-f', '-fd', '-fdx', '-d', '-D', '--delete']
    # 进冷却之前跑这些**只读**探针，把"这条命令会丢什么"现算出来放进窗口。
    evidence:
      - git status --porcelain
      - git diff --shortstat HEAD
      - git ls-files --others --exclude-standard
